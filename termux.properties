###############
# Extra keys
###############
### Merge this section into ~/.termux/termux.properties, then:
###   termux-reload-settings

### Symbols for illustrating keys: default, arrows-only, arrows-all, all, none
extra-keys-style = arrows-all

### Two rows: navigation cluster + keyboard toggle + left sidebar (DRAWER)
extra-keys = [['ESC','TAB','CTRL','ALT',{key: '-', popup: '|'},'HOME','END'], \
              ['PGUP','PGDN','LEFT','DOWN','UP','RIGHT','KEYBOARD','DRAWER']]

### KEYBOARD = toggle soft keyboard on/off
### DRAWER   = open Termux left sidebar
### '-' with swipe up = '|'
